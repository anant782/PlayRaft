
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayRaft - Play Free Online Games | Best Games Portal</title>
    <meta name="description" content="PlayRaft is your destination for the best free online games. Action, puzzles, racing, and more. No downloads required, play directly in your browser!" />
    <meta name="keywords" content="free games, online games, browser games, PlayRaft, action games, puzzle games" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://playraft.com/" />

    <meta property="twitter:description" content="Discover thousands of free online games on PlayRaft. Smooth gameplay and no downloads!" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PlayRaft",
      "url": "https://playraft.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://playraft.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'brand-dark': '#0F172A',
              'brand-blue': '#1E3A8A',

              'brand-text-primary': '#F9FAFB',
              'brand-text-secondary': '#9CA3AF',

    <style>

      .bg-dark-gradient {
        background-color: #1E3A8A;

      }

  <body class="bg-dark-gradient font-sans">
